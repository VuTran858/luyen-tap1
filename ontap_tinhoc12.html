const labels = ['A','B','C','D'];
let showingAnswers = false;
let submitted = false;

// Build Part 1
function buildPart1() {
  const container = document.getElementById('part1');
  part1.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = 'p1q' + qi;

    let optsHtml = '';
    q.opts.forEach((opt, oi) => {
      optsHtml += `<label class="option-label" id="p1q${qi}o${oi}">
        <input type="radio" name="p1q${qi}" value="${oi}"> <span>${labels[oi]}. ${opt}</span>
      </label>`;
    });

    block.innerHTML = `
      <div class="question-text"><span class="question-num">Câu ${qi+1}.</span> ${q.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="feedback" id="p1fb${qi}"></div>`;
    container.appendChild(block);
  });
}

// Build Part 2
function buildPart2() {
  const container = document.getElementById('part2');
  part2.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = 'p2q' + qi;

    let itemsHtml = '';
    q.items.forEach((item, ii) => {
      itemsHtml += `<label class="option-label" id="p2q${qi}i${ii}">
        <input type="checkbox" id="p2cb${qi}_${ii}"> <span>${labels[ii]}. ${item.text}</span>
      </label>`;
    });

    block.innerHTML = `
      <div class="question-text"><span class="question-num">Câu ${qi+1}.</span> ${q.q}</div>
      <div style="font-size:12px;color:#777;margin-bottom:8px;">Chọn tất cả các ý ĐÚNG (theo yêu cầu câu hỏi)</div>
      <div class="options">${itemsHtml}</div>
      <div class="feedback" id="p2fb${qi}"></div>`;
    container.appendChild(block);
  });
}

function submitAll() {
  submitted = true;
  let correct = 0;
  let total = part1.length + part2.length;

  // Grade Part 1
  part1.forEach((q, qi) => {
    const block = document.getElementById('p1q' + qi);
    const radios = document.querySelectorAll(`input[name="p1q${qi}"]`);
    let selected = -1;
    radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });

    const fb = document.getElementById('p1fb' + qi);
    q.opts.forEach((opt, oi) => {
      const lbl = document.getElementById(`p1q${qi}o${oi}`);
      lbl.querySelector('input').disabled = true;
      if (q.ans.includes(oi)) {
        if (selected === oi) lbl.className = 'option-label correct-ans';
        else lbl.className = 'option-label missed-ans';
      } else if (selected === oi) {
        lbl.className = 'option-label wrong-ans';
      }
    });

    if (selected !== -1 && q.ans.includes(selected)) {
      block.classList.add('correct');
      fb.className = 'feedback correct';
      fb.textContent = '✔ Đúng! Đáp án: ' + labels[q.ans[0]];
      correct++;
    } else {
      block.classList.add('wrong');
      fb.className = 'feedback wrong';
      fb.textContent = '✘ Sai! Đáp án đúng: ' + labels[q.ans[0]];
    }
  });

  // Grade Part 2 — mỗi câu đúng khi chọn đúng tất cả các ý
  part2.forEach((q, qi) => {
    const block = document.getElementById('p2q' + qi);
    let allCorrect = true;

    q.items.forEach((item, ii) => {
      const cb = document.getElementById(`p2cb${qi}_${ii}`);
      const lbl = document.getElementById(`p2q${qi}i${ii}`);
      cb.disabled = true;
      const userChecked = cb.checked;
      // correct: true = đáp án đúng => nên được chọn
      if (item.correct) {
        if (userChecked) lbl.className = 'option-label correct-ans';
        else { lbl.className = 'option-label missed-ans'; allCorrect = false; }
      } else {
        if (userChecked) { lbl.className = 'option-label wrong-ans'; allCorrect = false; }
      }
    });

    const fb = document.getElementById('p2fb' + qi);
    if (allCorrect) {
      block.classList.add('correct');
      fb.className = 'feedback correct';
      fb.textContent = '✔ Đúng hoàn toàn!';
      correct++;
    } else {
      block.classList.add('wrong');
      fb.className = 'feedback wrong';
      const correctLabels = q.items.map((it,ii)=>it.correct ? labels[ii] : null).filter(Boolean).join(', ');
      fb.textContent = '✘ Chưa đúng! Các ý đúng: ' + correctLabels;
    }
  });

  const scoreBar = document.getElementById('scoreBar');
  scoreBar.style.display = 'block';
  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('scoreTotal').textContent = total;
  document.getElementById('scorePct').textContent = Math.round(correct/total*100) + '%';
  scoreBar.scrollIntoView({behavior:'smooth'});
}

function toggleAnswers() {
  showingAnswers = !showingAnswers;
  const btn = document.querySelector('.btn-outline');
  if (showingAnswers) {
    btn.textContent = '🙈 Ẩn đáp án';
    // Show answers without grading
    part1.forEach((q, qi) => {
      q.opts.forEach((opt, oi) => {
        const lbl = document.getElementById(`p1q${qi}o${oi}`);
        if (!submitted) {
          if (q.ans.includes(oi)) lbl.style.background = '#e6f4ea';
          else lbl.style.background = '';
        }
      });
    });
    part2.forEach((q, qi) => {
      q.items.forEach((item, ii) => {
        const lbl = document.getElementById(`p2q${qi}i${ii}`);
        if (!submitted) {
          lbl.style.background = item.correct ? '#e6f4ea' : '';
          lbl.style.borderColor = item.correct ? '#43a047' : '';
        }
      });
    });
  } else {
    btn.textContent = '👁 Xem đáp án';
    if (!submitted) {
      part1.forEach((q, qi) => {
        q.opts.forEach((opt, oi) => {
          document.getElementById(`p1q${qi}o${oi}`).style.background = '';
        });
      });
      part2.forEach((q, qi) => {
        q.items.forEach((item, ii) => {
          const lbl = document.getElementById(`p2q${qi}i${ii}`);
          lbl.style.background = '';
          lbl.style.borderColor = '';
        });
      });
    }
  }
}

function resetAll() {
  submitted = false;
  showingAnswers = false;
  document.getElementById('scoreBar').style.display = 'none';
  document.querySelector('.btn-outline').textContent = '👁 Xem đáp án';

  part1.forEach((q, qi) => {
    const block = document.getElementById('p1q' + qi);
    block.className = 'question-block';
    const radios = document.querySelectorAll(`input[name="p1q${qi}"]`);
    radios.forEach(r => { r.checked = false; r.disabled = false; });
    q.opts.forEach((opt, oi) => {
      const lbl = document.getElementById(`p1q${qi}o${oi}`);
      lbl.className = 'option-label';
      lbl.style.background = '';
    });
    document.getElementById('p1fb' + qi).className = 'feedback';
  });

  part2.forEach((q, qi) => {
    const block = document.getElementById('p2q' + qi);
    block.className = 'question-block';
    q.items.forEach((item, ii) => {
      const cb = document.getElementById(`p2cb${qi}_${ii}`);
      cb.checked = false;
      cb.disabled = false;
      const lbl = document.getElementById(`p2q${qi}i${ii}`);
      lbl.className = 'option-label';
      lbl.style.background = '';
      lbl.style.borderColor = '';
    });
    document.getElementById('p2fb' + qi).className = 'feedback';
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

buildPart1();
buildPart2();
</script>
