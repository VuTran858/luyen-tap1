<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Practice Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #22263a;
    --accent: #4f8ef7;
    --accent2: #a78bfa;
    --correct: #34d399;
    --wrong: #f87171;
    --text: #e8eaf6;
    --muted: #6b7280;
    --border: #2e3354;
    --gold: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(10px);
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .score-badge {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--gold);
  }

  /* Progress */
  .progress-bar-wrap {
    width: 100%; height: 4px; background: var(--border);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }



  /* Main layout */
  .main { padding: 24px 32px 80px; max-width: 860px; margin: 0 auto; }

  /* Section title */
  .section-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--accent2);
    margin: 28px 0 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .section-desc {
    font-size: 0.83rem;
    color: var(--muted);
    margin-bottom: 18px;
  }

  /* Question card */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
    animation: fadeUp 0.3s ease both;
  }
  .q-card:hover { border-color: #3a3f5e; }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .q-number {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 0.97rem;
    line-height: 1.65;
    margin-bottom: 14px;
    color: var(--text);
  }
  .q-text em { color: var(--gold); font-style: normal; font-weight: 600; }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-size: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.18s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(79,142,247,0.08);
  }
  .option-btn .letter {
    min-width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.78rem;
    color: var(--muted);
    transition: all 0.18s;
  }
  .option-btn:hover:not(:disabled) .letter { background: var(--accent); border-color: var(--accent); color: white; }

  /* States */
  .option-btn.correct { border-color: var(--correct); background: rgba(52,211,153,0.1); }
  .option-btn.correct .letter { background: var(--correct); border-color: var(--correct); color: #0f1117; }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(248,113,113,0.1); }
  .option-btn.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: #0f1117; }
  .option-btn.reveal-correct { border-color: var(--correct); background: rgba(52,211,153,0.06); }
  .option-btn.reveal-correct .letter { background: var(--correct); border-color: var(--correct); color: #0f1117; }

  .feedback {
    margin-top: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { color: var(--correct); background: rgba(52,211,153,0.1); }
  .feedback.err { color: var(--wrong); background: rgba(248,113,113,0.1); }

  /* Results panel */
  .result-panel {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
  }
  .result-panel.show { display: flex; }
  .result-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 48px;
    text-align: center;
    max-width: 420px; width: 90%;
    animation: popIn 0.35s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity:0; }
    to   { transform: scale(1); opacity:1; }
  }
  .result-box .trophy { font-size: 3rem; margin-bottom: 12px; }
  .result-box h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    margin-bottom: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .result-box .big-score {
    font-size: 3.5rem; font-weight: 700;
    color: var(--gold);
    line-height: 1;
    margin: 16px 0 4px;
  }
  .result-box .out-of { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
  .result-box .pct {
    font-size: 1.1rem; font-weight: 600;
    margin-bottom: 24px;
  }
  .result-btn {
    padding: 12px 30px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .result-btn:hover { opacity: 0.88; }

  /* Submit */
  .submit-wrap { text-align: center; margin: 32px 0; }
  .submit-btn {
    padding: 14px 48px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    box-shadow: 0 4px 24px rgba(79,142,247,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(79,142,247,0.35); }

  /* Passage box */
  .passage-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 0.88rem;
    line-height: 1.75;
    color: #c5cae9;
    margin-bottom: 18px;
  }
  .passage-box strong { color: var(--gold); }

  /* Part label */
  .part-label {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: rgba(167,139,250,0.15);
    color: var(--accent2);
    border-radius: 6px;
    padding: 3px 10px;
    margin-bottom: 10px;
  }

  @media (max-width: 600px) {
    .header { padding: 16px 16px; }
    .main { padding: 16px 12px 80px; }
    .section-nav { padding: 14px 12px 0; }
    .result-box { padding: 28px 24px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 English Quiz</h1>
  <div class="score-badge">Score: <span id="scoreLive">0</span> / <span id="totalLive">0</span></div>
</div>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

<div class="main" id="mainContent"></div>

<div class="submit-wrap">
  <button class="submit-btn" onclick="submitAll()">🎯 Nộp bài & Xem kết quả</button>
</div>

<div class="result-panel" id="resultPanel">
  <div class="result-box">
    <div class="trophy" id="trophyEmoji">🏆</div>
    <h2>Kết quả</h2>
    <div class="big-score" id="finalScore">0</div>
    <div class="out-of">/ <span id="finalTotal">0</span> câu</div>
    <div class="pct" id="finalPct"></div>
    <button class="result-btn" onclick="resetAll()">🔄 Làm lại</button>
  </div>
</div>

<script>
// ===== DATA =====
const sections = [
  {
    id: "s1", label: "Reading 1 – Nick's Letter",
    type: "fill",
    passage: `Hi Janine,<br>How are you? How did your exams go? I'm sure you did well because you always study so hard. When it comes to learning, you have such a (1) ______ attitude! Anyway, I have some exciting news – I'm starting an apprenticeship next week!<br>About a month ago, I saw an online ad from a local company in my preferred field. They were looking for an apprentice, so I applied and got the placement! Learning by doing is something I've always excelled (2) ______, so I was really happy. It's also a great way to earn money and experience the real working world.<br>I'll work for an advertising company and learn about graphic design. The role is part of a big team, (3) ______ I'll gain experience and make contacts. I think I'll get used to the new environment quickly because (4) ______ is one of my strongest skills.<br>I'm still nervous, as I don't know much about advertising, but I hope to make up (5) ______ that with enthusiasm!<br>All my best, Nick`,
    questions: [
      { q: "Question 1: When it comes to learning, you have such a (1) ______ attitude!", options: ["A. beneficial","B. positive","C. confident","D. critical"], answer: 1 },
      { q: "Question 2: Learning by doing is something I've always excelled (2) ______", options: ["A. of","B. on","C. in","D. for"], answer: 2 },
      { q: "Question 3: The role is part of a big team, (3) ______ I'll gain experience", options: ["A. so","B. or","C. but","D. so that"], answer: 0 },
      { q: "Question 4: I'll get used to the new environment quickly because (4) ______ is one of my strongest skills.", options: ["A. motivation","B. discipline","C. empathy","D. adaptability"], answer: 3 },
      { q: "Question 5: I hope to make up (5) ______ that with enthusiasm!", options: ["A. with","B. over","C. for","D. around"], answer: 2 },
    ]
  },
  {
    id: "s2", label: "Reading 2 – AI Today",
    type: "fill",
    passage: `These days, AI is common in phones, homes and cars. The most common form is the smart assistant, which many people use every day. In fact, in 2022, over 120 million people used one at least once a month in the USA alone.<br>Statistics, based (1) ______ research, show people often use smart assistants to set reminders, make calls and search for products online. Others use them for work tasks such as reading and writing emails or arranging meetings. For them, it is a virtual assistant that helps manage their schedules.<br>There are also digital home assistants. They can (2) ______ the heating, lights and other smart devices around the house. New developments include self-driving cars and robots that help in hospitals. They can adapt to changing situations, so their tasks seem more human-like. While these developments have raised (3) ______ among the public, they still show AI's potential.<br>Some people can already put (4) ______ their TVs and devices using smartphones. In the future, we may have a (5) ______ robot to do chores.`,
    questions: [
      { q: "Question 1: Statistics, based (1) ______ research, show…", options: ["A. on","B. in","C. of","D. from"], answer: 0 },
      { q: "Question 2: They can (2) ______ the heating, lights and other smart devices.", options: ["A. command","B. manage","C. monitor","D. control"], answer: 3 },
      { q: "Question 3: These developments have raised (3) ______ among the public.", options: ["A. worries","B. problems","C. issues","D. concerns"], answer: 3 },
      { q: "Question 4: Some people can already put (4) ______ their TVs and devices.", options: ["A. up","B. on","C. over","D. through"], answer: 1 },
      { q: "Question 5: In the future, we may have a (5) ______ robot to do chores.", options: ["A. home","B. private","C. domestic","D. personalised"], answer: 2 },
    ]
  },
  {
    id: "s3", label: "Reading 3 – Lifelong Learning",
    type: "comprehension",
    passage: `Do you find learning after graduation difficult? If the answer is yes, you're not alone. Below are some of the most common difficulties people might have when trying to pursue lifelong learning.<br>
Lifelong learning can be time-consuming. Besides the time for classes, you'll have to complete assignments and take tests. Also, you may lose out on time for family and friends. While it isn't easy to deal with this problem, one possible solution is to find online classes that allow you to learn <strong>at your own pace</strong>.<br>
Another challenge is the cost of learning. Taking courses and buying materials can be pretty expensive. However, there are great free online resources that you can use as a start. You can also consider asking for financial help from your employer if you're looking to take more expensive courses for your job.<br>
You might also lose your motivation. Learning can sometimes be difficult or <em>tedious</em>. However, if you choose courses that you're truly interested in or that can lead to a job promotion, you may find it easier to pursue learning. You could also find support from a study partner. <u>Having someone to share your progress with can make learning more fun.</u><br>
In addition, you might not have access to learning resources. Thankfully, there are websites that have courses on lots of different topics. If you still can't find what you want, many experts now offer <strong>their</strong> own online courses. You can find out about these by following people on social media.<br>
To sum up, lifelong learning may be challenging, but there are ways to make it easier. Choose a suitable course and use any support you can find. And remember, it's never too late to learn and grow.`,
    questions: [
      { q: "Question 1: What would be the best title for the passage?", options: ["A. The Benefits of Lifelong Learning","B. Overcoming Challenges in Lifelong Learning","C. Strategies for Successful Lifelong Learning","D. Common Difficulties in Pursuing Further Education"], answer: 1 },
      { q: "Question 2: What does the phrase 'at your own pace' mostly mean?", options: ["A. learning on your own","B. learning with a strict schedule","C. learning with a fast pace","D. learning without any time limits"], answer: 3 },
      { q: "Question 3: The word 'tedious' is OPPOSITE in meaning to:", options: ["A. expensive","B. absorbing","C. dragging","D. effortless"], answer: 1 },
      { q: "Question 4: Which is NOT mentioned as a common difficulty when pursuing lifelong learning?", options: ["A. Difficulty in finding suitable study partners.","B. Time constraints due to classes, assignments, and tests.","C. Financial challenges associated with the cost of courses.","D. Motivational issues arising from tedious courses."], answer: 0 },
      { q: "Question 5: The word 'their' in paragraph 5 refers to:", options: ["A. experts'","B. websites'","C. online courses'","D. learning resources'"], answer: 0 },
      { q: "Question 6: Which sentence is closest in meaning to the underlined sentence?", options: ["A. Studying alone is usually more enjoyable.","B. Learning becomes more interesting when you study with someone.","C. Sharing your progress makes learning more difficult.","D. It is better not to tell others about your learning progress."], answer: 1 },
      { q: "Question 7: It can be inferred from the passage that:", options: ["A. Lifelong learning benefits those seeking job promotions the most.","B. Most people find learning after graduation to be a challenge.","C. Lifelong learning is guaranteed to be enjoyable for everyone.","D. Online learning can help address many challenges of lifelong learning."], answer: 3 },
    ]
  },
  {
    id: "s4", label: "Reading 4 – Types of AI",
    type: "comprehension",
    passage: `There are two broad types of artificial intelligence: weak and strong. Weak AI is used in systems that carry out a single task. An example of this is email filters which identify and block spam messages. <strong>Strong AI</strong> systems, on the other hand, are more <em>advanced</em> systems that can complete complex tasks and that involve independent problem-solving. Self-driving cars are an example of this.<br>
Then, there are a further four different types of AI. The first type is reactive AI. This is a response-based system which uses algorithms to react to the data it receives from users. A common example is video game AI that reacts to a player's action. It chooses the best strategy to win the game depending on the behaviour of its opponent, and will always react in the same way to the same way if the player's actions remain the same. So, to <u>break a winning streak</u> and defeat the AI, players have to adapt their approach.<br>
The second type is limited memory AI. This is a learning AI that can adapt its behaviour according to experience or fresh data. An example is a self-driving car that can adapt to a new road. <u>However, the potential for updating is limited and the length of memory is short.</u><br>
Theory-of-mind AI is a type of AI that is better at remembering and learning from past experiences. It can adapt easily and even has the ability to imitate real human behaviour. This impressive AI is often found in advanced chatbots.<br>
Finally, there is the self-aware AI – a type of AI that is aware of its own existence. Most experts believe this type will never exist, but there are many science-fiction writers who disagree!`,
    questions: [
      { q: "Question 1: What is the main idea of the first paragraph?", options: ["A. Strong AI is more useful than weak AI.","B. Strong AI is more commonly used than weak AI.","C. Weak AI systems are becoming less popular.","D. Weak AI and strong AI can be equally useful."], answer: 3 },
      { q: "Question 2: Find the word OPPOSITE in meaning to 'advanced':", options: ["A. simple","B. complex","C. modern","D. intelligent"], answer: 0 },
      { q: "Question 3: The writer says that reactive AI:", options: ["A. is only used in video games","B. uses algorithms to receive data","C. responds to the behaviour of users","D. helps players to find a better strategy"], answer: 2 },
      { q: "Question 4: Which is NOT true according to the passage?", options: ["A. The AI in self-driving cars can update itself in a wide variety of ways.","B. Experts have succeeded in developing self-aware AI.","C. Theory-of-mind AI is able to act in the same way that people do.","D. Limited memory AI can change how it acts when it receives new information."], answer: 1 },
      { q: "Question 5: Which can be inferred from the passage?", options: ["A. AI is used in many aspects of email communication.","B. Video game players often struggle to defeat AI.","C. Most AI chatbots now use theory-of-mind AI.","D. Self-aware AI regularly appears in popular media."], answer: 3 },
      { q: "Question 6: 'Break a winning streak' is closest in meaning to:", options: ["A. get rid of bad luck","B. end a series of successes","C. no longer have the best performances","D. stop being in top condition"], answer: 1 },
      { q: "Question 7: Find the sentence closest in meaning to the underlined sentence in paragraph 3:", options: ["A. This AI can store a large amount of information for a long time.","B. This AI cannot update its system at all.","C. This AI can only update a little and remember information for a short time.","D. This AI improves its memory continuously."], answer: 2 },
    ]
  },
  {
    id: "s5", label: "Reading 5 – Mobile Apps",
    type: "comprehension",
    passage: `A mobile app is a type of software that is developed for use with mobile devices such as smartphones and tablets. Other types of applications include web apps and desktop apps, but these run in web browsers or on desktop computers.<br>
<u>Mobile apps tend to have fewer features than desktop or browser apps.</u> This is because they need to run on less processing power, battery and memory. Also, mobile apps have to be able to operate on mobile networks, which often have different speed and data limits, especially in rural areas. They also have to work on smaller screens than computers and still be user-friendly so people enjoy using them.<br>
Mobile apps started to appear in the 1980s when the first personal digital assistants were released, but they were very <em>basic</em>. In the beginning, they were often just simple clocks or calculators. Then from the 2000s, apps became more sophisticated and there were text message apps and email apps. Once 3G technology arrived, much larger files could be downloaded, which meant software companies could create more advanced apps like video games. Then, smartphone manufacturers allowed users to download third-party apps (apps created by other companies), including shopping apps and travel apps and a whole new industry was started.<br>
These days, <strong>cutting-edge</strong> smartphones come with many apps already installed on them, such as an email app, a calendar, a search engine, a weather app and more. There are also app stores run by smartphone companies or operating systems where users can choose from millions of different apps to download. Most of them are free, but some you have to pay for. Sometimes, the free ones have lots of ads.<br>
Over the next few years, as new technology develops, we will most likely see more of what apps can do.`,
    questions: [
      { q: "Question 1: What is the main idea of the first paragraph?", options: ["A. There is a wide variety of app types.","B. Some apps are not available on mobile devices.","C. Different types of applications have different uses.","D. Mobile apps differ from other types of apps."], answer: 3 },
      { q: "Question 2: What does having less processing power mean for mobile apps?", options: ["A. They consume more battery than other apps.","B. They are more user-friendly than other types of apps.","C. They cannot perform as many functions as other apps.","D. They don't work as well in areas with bad connection."], answer: 2 },
      { q: "Question 3: Which is NOT true according to the passage?", options: ["A. Email apps were common in the 2000s.","B. Mobiles have not always had third-party apps.","C. The first apps were similar to personal digital assistants.","D. Game apps became more popular when 3G technology appeared."], answer: 2 },
      { q: "Question 4: Which can be inferred from the passage?", options: ["A. The apps already installed on phones are not efficient.","B. Free mobile apps make money from advertising.","C. The majority of apps use a large amount of memory.","D. Some smartphones don't have the technology to install new apps."], answer: 1 },
      { q: "Question 5: The word 'cutting-edge' is closest in meaning to:", options: ["A. really fashionable","B. highly efficient","C. first place","D. most up-to-date"], answer: 3 },
      { q: "Question 6: Find the sentence closest in meaning to the underlined sentence:", options: ["A. Mobile apps usually include more functions than other apps.","B. Desktop apps often have fewer features than mobile apps.","C. Mobile apps normally do not have as many functions as other apps.","D. Mobile apps and desktop apps have the same number of features."], answer: 2 },
      { q: "Question 7: Find the word OPPOSITE in meaning to 'basic' in paragraph 3:", options: ["A. simple","B. advanced","C. small","D. early"], answer: 1 },
    ]
  },
  {
    id: "s6", label: "Writing – Sentence Arrangement",
    type: "arrangement",
    questions: [
      { q: "Question 1: Arrange: a. Sarah: You should review your notes and take some practice tests! / b. Sarah: Hi, Alex! Are you ready for the exam tomorrow? / c. Alex: Not really, I still have a lot to study.", options: ["A. c-a-b","B. b-c-a","C. c-b-a","D. a-c-b"], answer: 1 },
      { q: "Question 2: Arrange: a. Mark: Which country are you considering? / b. Jenna: I'm thinking about Spain... / c. Mark: That sounds exciting! / d. Mark: What made you decide to study abroad? / e. Jenna: I want to experience a different culture...", options: ["A. c-b-a-e-d","B. c-e-d-b-a","C. d-b-a-e-c","D. d-e-a-b-c"], answer: 3 },
      { q: "Question 3: Arrange: a. Additionally, privacy concerns arise... / b. In conclusion, despite their potential... / c. Home robots, while promising convenience... / d. Finally, their capabilities might not always meet expectations... / e. Firstly, they can make individuals dependent... / f. Secondly, their maintenance cost could be very high...", options: ["A. c-e-a-d-f-b","B. c-e-f-a-d-b","C. c-e-f-d-a-b","D. c-e-a-f-b-d"], answer: 1 },
      { q: "Question 4: Arrange: a. Then discover how AI can personalize learning experiences... / b. First, explore innovative AI technologies reshaping classrooms... / c. Together with the use for your students... / d. Here's what you'll learn in the workshop on AI. / e. Finally, engage in hands-on activities and interactive discussions...", options: ["A. d-a-b-e-c","B. d-b-a-c-e","C. b-e-a-c-d","D. b-c-a-e-d"], answer: 1 },
      { q: "Question 5: Arrange: a. Last but not least, journaling promotes self-expression... / b. In summary, this daily writing habit has made the English learning journey... / c. To commence with, it enhances vocabulary... / d. Not to mention that consistent writing practice improves grammar... / e. Maintaining a daily journal has notable benefits for English learning.", options: ["A. e-c-d-a-b","B. e-a-c-b-d","C. c-a-b-d-e","D. c-e-a-b-d"], answer: 0 },

// ===== STATE =====
let answered = {};

// ===== INIT =====
function init() {
  renderContent();
}

function renderContent() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  sections.forEach(sec => {
    const wrap = document.createElement('div');

    let passageHTML = '';
    if (sec.passage) {
      passageHTML = `<div class="passage-box">${sec.passage}</div>`;
    }

    const typeLabels = {fill: 'Fill in the blank', comprehension: 'Reading Comprehension', arrangement: 'Sentence Arrangement', rewrite: 'Sentence Transformation'};

    let qs = sec.questions.map((q, qi) => buildQuestion(sec.id, qi, q)).join('');

    wrap.innerHTML = `
      <div class="section-heading">${sec.label}</div>
      <div class="part-label">${typeLabels[sec.type] || sec.type}</div>
      ${passageHTML}
      ${qs}
    `;
    main.appendChild(wrap);
  });

  updateProgress();
}

function buildQuestion(secId, qi, q) {
  const key = `${secId}-${qi}`;
  const state = answered[key];

  const opts = q.options.map((opt, oi) => {
    let cls = '';
    let disabled = '';
    if (state) {
      disabled = 'disabled';
      if (oi === q.answer) cls = state.chosen === oi ? 'correct' : 'reveal-correct';
      else if (oi === state.chosen && state.chosen !== q.answer) cls = 'wrong';
    }
    const letter = ['A','B','C','D'][oi];
    return `<button class="option-btn ${cls}" ${disabled} onclick="choose('${secId}',${qi},${oi})">
      <span class="letter">${letter}</span>${opt.replace(/^[A-D]\.\s*/,'')}
    </button>`;
  }).join('');

  let fb = '';
  if (state) {
    if (state.chosen === q.answer) {
      fb = `<div class="feedback ok show">✅ Chính xác!</div>`;
    } else {
      const correctLetter = ['A','B','C','D'][q.answer];
      fb = `<div class="feedback err show">❌ Sai. Đáp án đúng: ${correctLetter}</div>`;
    }
  }

  return `<div class="q-card" id="qcard-${secId}-${qi}">
    <div class="q-number">${secId.toUpperCase()} · Q${qi+1}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">${opts}</div>
    ${fb}
  </div>`;
}

function choose(secId, qi, oi) {
  const key = `${secId}-${qi}`;
  if (answered[key]) return;
  const sec = sections.find(s => s.id === secId);
  const q = sec.questions[qi];
  answered[key] = { chosen: oi, correct: oi === q.answer };
  // Re-render just this card
  const card = document.getElementById(`qcard-${secId}-${qi}`);
  if (card) {
    const tmp = document.createElement('div');
    tmp.innerHTML = buildQuestion(secId, qi, q);
    card.replaceWith(tmp.firstElementChild);
  }
  updateProgress();
}

function updateProgress() {
  const total = sections.reduce((a,s) => a + s.questions.length, 0);
  const done = Object.keys(answered).length;
  const correct = Object.values(answered).filter(v => v.correct).length;
  document.getElementById('progressBar').style.width = (done/total*100) + '%';
  document.getElementById('scoreLive').textContent = correct;
  document.getElementById('totalLive').textContent = done;
}

function submitAll() {
  const total = sections.reduce((a,s) => a + s.questions.length, 0);
  const done = Object.keys(answered).length;
  const correct = Object.values(answered).filter(v => v.correct).length;
  const pct = Math.round(correct/total*100);

  // Auto-answer unanswered (reveal correct)
  sections.forEach(sec => {
    sec.questions.forEach((q, qi) => {
      const key = `${sec.id}-${qi}`;
      if (!answered[key]) {
        answered[key] = { chosen: -1, correct: false };
      }
    });
  });

  renderContent();
  updateProgress();

  document.getElementById('finalScore').textContent = correct;
  document.getElementById('finalTotal').textContent = total;
  document.getElementById('finalPct').textContent = pct + '% — ' + getRating(pct);
  document.getElementById('trophyEmoji').textContent = pct >= 90 ? '🏆' : pct >= 70 ? '🎯' : pct >= 50 ? '📚' : '💪';
  document.getElementById('resultPanel').classList.add('show');
}

function getRating(pct) {
  if (pct >= 90) return 'Xuất sắc!';
  if (pct >= 80) return 'Giỏi!';
  if (pct >= 70) return 'Khá!';
  if (pct >= 50) return 'Trung bình';
  return 'Cần cố gắng hơn';
}

function resetAll() {
  answered = {};
  document.getElementById('resultPanel').classList.remove('show');
  renderContent();
  updateProgress();
}

init();
</script>
